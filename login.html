<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Войти · Энергетический Календарь</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--gold:#C4922A;--gold2:#E8B84B;--dark:#080706;--dark2:#111009;--dark3:#1A180F;--text:#F0EBE0;--text2:#B8B098;--text3:#6A6450;--border:rgba(196,146,42,0.2);--err:#E05050;--ok:#50A870;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--dark);color:var(--text);font-family:'Outfit',sans-serif;font-weight:300;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden;}
body::before{content:'';position:fixed;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(196,146,42,0.07) 0%,transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;}
.back-link{position:fixed;top:24px;left:24px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text3);text-decoration:none;letter-spacing:0.5px;transition:color 0.2s;z-index:10;}
.back-link:hover{color:var(--gold);}
.auth-card{width:100%;max-width:420px;background:var(--dark2);border:1px solid var(--border);padding:48px 40px;position:relative;z-index:1;animation:fadeUp 0.5s ease both;}
.auth-logo{text-align:center;margin-bottom:36px;}
.auth-logo h1{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:400;letter-spacing:0.5px;}
.auth-logo h1 span{color:var(--gold);font-style:italic;}
.auth-logo p{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--text3);margin-top:4px;}
.auth-tabs{display:flex;background:rgba(255,255,255,0.04);border-radius:2px;padding:3px;margin-bottom:32px;gap:3px;}
.auth-tab{flex:1;padding:10px;text-align:center;font-size:12px;font-weight:400;color:var(--text3);border-radius:1px;cursor:pointer;transition:all 0.2s;border:none;background:transparent;font-family:'Outfit',sans-serif;letter-spacing:0.3px;}
.auth-tab.active{background:var(--dark3);color:var(--text);border:1px solid var(--border);}
.form-group{margin-bottom:18px;}
.form-label{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--text3);margin-bottom:8px;display:block;}
.form-input{width:100%;padding:13px 16px;background:rgba(255,255,255,0.04);border:1px solid rgba(196,146,42,0.15);color:var(--text);font-family:'Outfit',sans-serif;font-size:14px;font-weight:300;outline:none;transition:border-color 0.2s,background 0.2s;border-radius:2px;}
.form-input:focus{border-color:var(--gold);background:rgba(255,255,255,0.06);}
.form-input::placeholder{color:var(--text3);}
.plan-select{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;}
.plan-option{padding:14px;border:1px solid rgba(196,146,42,0.15);border-radius:2px;cursor:pointer;transition:all 0.2s;text-align:center;background:rgba(255,255,255,0.02);}
.plan-option:hover{border-color:rgba(196,146,42,0.4);}
.plan-option.selected{border-color:var(--gold);background:rgba(196,146,42,0.08);}
.plan-name{font-size:13px;font-weight:500;margin-bottom:3px;}
.plan-price{font-family:'Cormorant Garamond',serif;font-size:18px;color:var(--gold);}
.btn-auth{width:100%;padding:14px;background:var(--gold);border:none;border-radius:2px;color:var(--dark);font-family:'Outfit',sans-serif;font-size:14px;font-weight:600;letter-spacing:0.3px;cursor:pointer;transition:opacity 0.2s;margin-top:8px;}
.btn-auth:hover{opacity:0.88;}
.auth-note{margin-top:20px;font-size:12px;color:var(--text3);text-align:center;line-height:1.7;padding:14px;background:rgba(196,146,42,0.06);border:1px solid var(--border);border-radius:2px;}
.msg-box{padding:12px 16px;border-radius:2px;font-size:13px;margin-bottom:16px;display:none;}
.msg-box.error{background:rgba(224,80,80,0.1);border:1px solid rgba(224,80,80,0.3);color:var(--err);}
.msg-box.success{background:rgba(80,168,112,0.1);border:1px solid rgba(80,168,112,0.3);color:var(--ok);}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>

<a href="index.html" class="back-link">← Главная</a>

<div class="auth-card">
  <div class="auth-logo">
    <h1>Энергетический <span>Календарь</span></h1>
    <p>Digital Consulting</p>
  </div>

  <div class="auth-tabs">
    <button class="auth-tab active" id="tab-login" onclick="showTab('login')">Войти</button>
    <button class="auth-tab" id="tab-register" onclick="showTab('register')">Регистрация</button>
  </div>

  <div class="msg-box" id="msg-box"></div>

  <!-- LOGIN FORM -->
  <div id="form-login">
    <div class="form-group">
      <label class="form-label">Email</label>
      <input class="form-input" type="email" id="login-email" placeholder="your@email.com">
    </div>
    <div class="form-group">
      <label class="form-label">Пароль</label>
      <input class="form-input" type="password" id="login-password" placeholder="••••••••">
    </div>
    <button class="btn-auth" onclick="doLogin()">Войти в кабинет</button>
    <div class="auth-note">
      Доступ предоставляется после оплаты.<br>
      Связаться: <strong style="color:var(--gold)">+7 ___ ___ __ __</strong>
    </div>
  </div>

  <!-- REGISTER FORM -->
  <div id="form-register" style="display:none;">
    <div class="form-group">
      <label class="form-label">Ваше имя</label>
      <input class="form-input" type="text" id="reg-name" placeholder="Имя и фамилия">
    </div>
    <div class="form-group">
      <label class="form-label">Email</label>
      <input class="form-input" type="email" id="reg-email" placeholder="your@email.com">
    </div>
    <div class="form-group">
      <label class="form-label">Пароль</label>
      <input class="form-input" type="password" id="reg-password" placeholder="Минимум 6 символов">
    </div>
    <div class="form-label" style="margin-bottom:10px;">Выберите тариф</div>
    <div class="plan-select">
      <div class="plan-option selected" id="plan-basic" onclick="selectPlan('basic')">
        <div class="plan-name">Базовый</div>
        <div class="plan-price">15 000 тг</div>
      </div>
      <div class="plan-option" id="plan-full" onclick="selectPlan('full')">
        <div class="plan-name">Полный</div>
        <div class="plan-price">15 000 тг</div>
      </div>
    </div>
    <div class="auth-note" style="margin-bottom:16px;">
      После регистрации свяжитесь для оплаты:<br>
      <strong style="color:var(--gold)">+7 ___ ___ __ __</strong><br>
      После оплаты администратор активирует ваш аккаунт.
    </div>
    <button class="btn-auth" onclick="doRegister()">Создать аккаунт</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://gigfvlhcrtuosfnkzqpt.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Hw69inUK0lqA5ECoVeGgRQ_kWEyD4Pt';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ── Tab switching ──────────────────────────────
function showTab(tab) {
  var loginForm    = document.getElementById('form-login');
  var registerForm = document.getElementById('form-register');
  var loginTab     = document.getElementById('tab-login');
  var registerTab  = document.getElementById('tab-register');

  if (tab === 'login') {
    loginForm.style.display    = 'block';
    registerForm.style.display = 'none';
    loginTab.classList.add('active');
    registerTab.classList.remove('active');
  } else {
    loginForm.style.display    = 'none';
    registerForm.style.display = 'block';
    loginTab.classList.remove('active');
    registerTab.classList.add('active');
  }
  hideMsg();
}

// ── Plan selection ─────────────────────────────
var selectedPlan = 'basic';
function selectPlan(plan) {
  selectedPlan = plan;
  document.getElementById('plan-basic').classList.toggle('selected', plan === 'basic');
  document.getElementById('plan-full').classList.toggle('selected', plan === 'full');
}

// ── Messages ───────────────────────────────────
function showMsg(text, type) {
  var box = document.getElementById('msg-box');
  box.textContent = text;
  box.className = 'msg-box ' + (type || 'error');
  box.style.display = 'block';
}
function hideMsg() {
  document.getElementById('msg-box').style.display = 'none';
}

// ── Login ──────────────────────────────────────
async function doLogin() {
  var email    = document.getElementById('login-email').value.trim();
  var password = document.getElementById('login-password').value;

  if (!email || !password) { showMsg('Введите email и пароль'); return; }

  var btn = document.querySelector('#form-login .btn-auth');
  btn.textContent = 'Вход...';
  btn.disabled = true;

  var result = await supabaseClientClient.auth.signInWithPassword({ email: email, password: password });

  if (result.error) {
    showMsg('Неверный email или пароль');
    btn.textContent = 'Войти в кабинет';
    btn.disabled = false;
    return;
  }

  var profileResult = await supabaseClient
    .from('profiles')
    .select('role, is_active')
    .eq('id', result.data.user.id)
    .single();

  var profile = profileResult.data;

  if (profile && profile.role === 'admin') {
    window.location.href = 'admin.html';
  } else if (profile && profile.is_active) {
    window.location.href = 'cabinet.html';
  } else {
    showMsg('Ваш аккаунт ожидает активации. Свяжитесь с администратором.');
    await supabaseClient.auth.signOut();
    btn.textContent = 'Войти в кабинет';
    btn.disabled = false;
  }
}

// ── Register ───────────────────────────────────
async function doRegister() {
  var name     = document.getElementById('reg-name').value.trim();
  var email    = document.getElementById('reg-email').value.trim();
  var password = document.getElementById('reg-password').value;

  if (!name)              { showMsg('Введите ваше имя'); return; }
  if (!email)             { showMsg('Введите email'); return; }
  if (password.length < 6){ showMsg('Пароль должен быть минимум 6 символов'); return; }

  var btn = document.querySelector('#form-register .btn-auth');
  btn.textContent = 'Регистрация...';
  btn.disabled = true;

  var result = await supabaseClientClient.auth.signUp({ email: email, password: password });

  if (result.error) {
    showMsg(result.error.message === 'User already registered'
      ? 'Этот email уже зарегистрирован. Войдите.'
      : 'Ошибка регистрации. Попробуйте ещё раз.');
    btn.textContent = 'Создать аккаунт';
    btn.disabled = false;
    return;
  }

  await supabaseClient.from('profiles').upsert({
    id: result.data.user.id,
    name: name,
    email: email,
    plan: selectedPlan,
    role: 'client',
    is_active: false,
    psycho_count: 0,
    created_at: new Date().toISOString()
  });

  showMsg('Аккаунт создан! Свяжитесь с администратором для активации: +7 ___ ___ __ __', 'success');
  btn.textContent = 'Создать аккаунт';
  btn.disabled = false;
}

// ── Check existing session ─────────────────────
async function checkSession() {
  var sessionResult = await supabaseClient.auth.getSession();
  if (sessionResult.data.session) {
    var profileResult = await supabaseClient
      .from('profiles')
      .select('role, is_active')
      .eq('id', sessionResult.data.session.user.id)
      .single();
    var profile = profileResult.data;
    if (profile && profile.role === 'admin') window.location.href = 'admin.html';
    else if (profile && profile.is_active)   window.location.href = 'cabinet.html';
  }
}

// ── URL params ─────────────────────────────────
var params = new URLSearchParams(window.location.search);
if (params.get('action') === 'register') showTab('register');
if (params.get('plan'))                  selectPlan(params.get('plan'));

// Enter key
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    var loginVisible = document.getElementById('form-login').style.display !== 'none';
    if (loginVisible) doLogin();
    else doRegister();
  }
});

checkSession();
</script>
</body>
</html>
