<style>

*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-weight:300;min-height:100vh;line-height:1.6;}
.wrap{max-width:820px;margin:0 auto;padding:0 20px 60px;}

/* Header */
.report-header{background:var(--bg2);border-bottom:1px solid var(--border);padding:20px 0;margin-bottom:28px;}
.report-header-inner{max-width:820px;margin:0 auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
.logo-text{font-family:'Playfair Display',serif;font-size:16px;font-weight:500;color:var(--text);}
.logo-text span{color:var(--gold);}
.logo-sub{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--text3);margin-top:2px;}
.master-badge{display:flex;align-items:center;gap:10px;background:var(--bg3);border:1px solid var(--border-gold);border-radius:40px;padding:8px 16px;}
.master-av{width:28px;height:28px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:12px;color:#fff;flex-shrink:0;font-weight:600;}
.master-info{line-height:1.3;}
.master-name{font-size:12px;color:var(--text);font-weight:500;}
.master-spec{font-size:10px;color:var(--text3);}

/* Hero */
.hero{text-align:center;padding:32px 0 24px;}
.client-name{font-family:'Playfair Display',serif;font-size:32px;font-weight:400;color:var(--gold);margin-bottom:6px;}
.client-sub{font-size:12px;color:var(--text3);letter-spacing:1px;}
.nums-row{display:flex;gap:14px;justify-content:center;margin-top:20px;flex-wrap:wrap;}
.num-card{background:var(--bg2);border:1px solid var(--border-gold);border-radius:var(--radius);padding:16px 28px;text-align:center;box-shadow:var(--shadow);}
.num-val{font-family:'Playfair Display',serif;font-size:44px;color:var(--gold);line-height:1;margin-bottom:4px;}
.num-label{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--text3);}

/* Sections */
.section-label{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--text3);margin-bottom:12px;display:flex;align-items:center;gap:10px;}
.section-label::after{content:'';flex:1;height:1px;background:var(--border);}
.divider{border:none;border-top:1px solid var(--border);margin:18px 0;}
.e-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;box-shadow:var(--shadow);}
.e-body{padding:18px 20px;display:flex;flex-direction:column;gap:12px;}
.e-desc{font-size:13px;color:var(--text2);line-height:1.85;}
.e-desc pre{white-space:pre-wrap;font-family:'Inter',sans-serif;font-size:13px;line-height:1.85;}
.pm-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.pm-box{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px 14px;}
.pm-box.plus{background:var(--plus-bg);border-color:var(--plus-border);}
.pm-box.minus{background:var(--minus-bg);border-color:var(--minus-border);}
.pm-title{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);margin-bottom:5px;font-weight:500;}
.pm-box.plus .pm-title{color:var(--plus-text);}
.pm-box.minus .pm-title{color:var(--minus-text);}
.pm-text{font-size:12.5px;color:var(--text2);line-height:1.6;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;margin:2px;}
.tag-green{background:var(--tag-green-bg);color:var(--tag-green-text);}
.tag-red{background:var(--tag-red-bg);color:var(--tag-red-text);}
.tag-blue{background:var(--tag-blue-bg);color:var(--tag-blue-text);}
.matrix-wrap{display:grid;grid-template-columns:repeat(3,58px);gap:7px;}
.matrix-cell{width:58px;height:58px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:20px;border:1.5px solid var(--matrix-empty-border);background:var(--matrix-empty-bg);color:var(--matrix-empty-text);}
.matrix-cell.present{border-color:var(--matrix-full-border);background:var(--matrix-full-bg);color:var(--text);}
.line-item{padding:10px 13px;border-radius:10px;border:1px solid var(--line-active-border);background:var(--line-active-bg);margin-bottom:6px;}
.line-name{font-size:12px;font-weight:500;color:var(--gold);margin-bottom:2px;}
.line-desc{font-size:11.5px;color:var(--text2);line-height:1.5;}
.energy-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px;}
.energy-cell{border-radius:10px;padding:11px 6px;text-align:center;border:1.5px solid var(--border);}
.energy-cell.present{background:var(--energy-present-bg);border-color:var(--energy-present-border);}
.energy-cell.absent{background:var(--energy-absent-bg);border-color:var(--energy-absent-border);}
.ec-num{font-family:'Playfair Display',serif;font-size:24px;line-height:1;margin-bottom:3px;}
.energy-cell.present .ec-num{color:var(--energy-present-text);}
.energy-cell.absent .ec-num{color:var(--energy-absent-text);}
.ec-label{font-size:8px;color:var(--text3);}
.how-card{background:var(--how-bg);border:1px solid var(--how-border);border-radius:10px;padding:13px 15px;margin-bottom:7px;}
.how-title{font-size:10px;font-weight:600;color:var(--how-title);margin-bottom:6px;}
.how-body{font-size:12px;color:var(--text2);line-height:1.7;white-space:pre-line;}
.trigger-list{list-style:none;display:flex;flex-direction:column;gap:5px;}
.trigger-list li{font-size:12.5px;color:var(--text2);padding:7px 11px;background:var(--bg3);border-radius:6px;border:1px solid var(--border);}
.compat-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px;}
.compat-label{font-size:10px;color:var(--text3);min-width:90px;}
.compat-item{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500;}
.c-best{background:var(--tag-green-bg);color:var(--tag-green-text);}
.c-good{background:var(--tag-blue-bg);color:var(--tag-blue-text);}
.c-neutral{background:#FDF6E8;color:#7A5010;}
.c-bad{background:var(--tag-red-bg);color:var(--tag-red-text);}
.color-dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:middle;margin-right:4px;border:2px solid var(--border);}
.gen-rec-list{list-style:none;display:flex;flex-direction:column;gap:6px;}
.gen-rec-list li{font-size:12.5px;color:var(--text2);line-height:1.6;padding:9px 13px;background:var(--bg3);border-radius:8px;border:1px solid var(--border);}
.gen-rec-list li strong{color:var(--gold);}
.prof-card{background:#EEF4FB;border:1px solid #B8CDE8;border-radius:10px;padding:15px 17px;margin-bottom:10px;}
.prof-card-title{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#1E3C6A;margin-bottom:10px;font-weight:600;}

/* Footer мастера */
.master-footer{margin-top:40px;background:var(--bg2);border:1px solid var(--border-gold);border-radius:var(--radius);padding:24px 28px;text-align:center;}
.mf-label{font-size:9px;letter-spacing:2.5px;text-transform:uppercase;color:var(--text3);margin-bottom:14px;}
.mf-name{font-family:'Playfair Display',serif;font-size:20px;color:var(--gold);margin-bottom:4px;}
.mf-spec{font-size:12px;color:var(--text3);margin-bottom:16px;}
.mf-contacts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
.mf-wa{display:inline-flex;align-items:center;gap:7px;background:#25D366;color:#fff;text-decoration:none;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:500;}
.mf-ig{display:inline-flex;align-items:center;gap:7px;background:var(--bg3);border:1px solid var(--border);color:var(--text2);text-decoration:none;padding:10px 20px;border-radius:8px;font-size:13px;}

/* Loading */
.loading{text-align:center;padding:80px 20px;}
.loading-icon{font-size:40px;margin-bottom:16px;animation:spin 1.5s linear infinite;display:inline-block;}
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
.loading-text{font-size:14px;color:var(--text3);}
.error-box{text-align:center;padding:80px 20px;}
.error-icon{font-size:48px;margin-bottom:16px;}

@media(max-width:640px){
  .pm-grid,.grid-2{grid-template-columns:1fr;}
  .nums-row{gap:10px;}
  .num-card{padding:14px 20px;}
  .num-val{font-size:36px;}
  .client-name{font-size:26px;}
  .master-footer{padding:18px;}
}
</style>
</head>

const PERSONALITY={1:`При описании личности важно понимать, что каждый человек может находиться в двух состояниях: в плюсе (позитиве) или в минусе (негативе). В плюсе у человека будет один набор качеств, а в минусе — соответственно противоположный. Ваша реализация в жизни напрямую будет зависеть от того, в каком состоянии Вы находитесь.\n\nВы — сильная личность. Самостоятельный, независимый и амбициозный человек. Вектор сознания направлен только на себя. Вы не любите, когда Вам указывают, что делать и как. Ваш внутренний девиз: «Я сам(а) всё знаю». Вы — первопроходец, пионер — идёте туда, куда другие боятся идти.\n\nВ плюсе в Вас заложены: самостоятельность, смелость, целеустремлённость, уверенность. В минусе проявляются: эгоизм, агрессивность, властность, деспотизм.\n\nДля успешной реализации в жизни Вам необходимо работать над собственным эгоизмом!`,2:`При описании личности важно понимать, что каждый человек может находиться в двух состояниях: в плюсе (позитиве) или в минусе (негативе). В плюсе у человека будет один набор качеств, а в минусе — соответственно противоположный. Ваша реализация в жизни напрямую будет зависеть от того, в каком состоянии Вы находитесь.\n\nВы — тонкий психолог. Умеете чувствовать людей. Вектор сознания направлен на желание понять другого человека. В Вас заложен дар — понимать людей и ситуации лучше, чем другие.\n\nВ плюсе: понимание, дипломатичность, интуиция, мягкость. В минусе: депрессия, сомнения, двуличность, манипулятивность.\n\nДля успешной реализации в жизни Вам необходимо научиться понимать других людей!`,3:`При описании личности важно понимать, что каждый человек может находиться в двух состояниях: в плюсе (позитиве) или в минусе (негативе). В плюсе у человека будет один набор качеств, а в минусе — соответственно противоположный. Ваша реализация в жизни напрямую будет зависеть от того, в каком состоянии Вы находитесь.\n\nВы — прирождённый наставник и аналитик. Вектор сознания направлен на анализ и управление. Вы очень умный, рассудительный, справедливый человек. Знания и интеллект — Ваши главные активы.\n\nВ плюсе: аналитический склад ума, наставничество, справедливость, мудрость. В минусе: холодность, расчётливость, жёсткость, несправедливость.\n\nДля успешной реализации в жизни Вам необходимо развивать мудрость наставника!`,4:`При описании личности важно понимать, что каждый человек может находиться в двух состояниях: в плюсе (позитиве) или в минусе (негативе). В плюсе у человека будет один набор качеств, а в минусе — соответственно противоположный. Ваша реализация в жизни напрямую будет зависеть от того, в каком состоянии Вы находитесь.\n\nВы человек с креативным мышлением, новатор, трансформатор и борец за справедливость. Вы очень добрый человек. Рождены отдавать и при этом для Вас важно, чтобы всё было по-честному.\n\nВ минусе будут проявляться: неудовлетворённость, разрушение, отчуждённость, апатия.\n\nДля успешной реализации в жизни Вам необходимо изучать законы позитивного мышления!`,5:`При описании личности важно понимать, что каждый человек может находиться в двух состояниях: в плюсе (позитиве) или в минусе (негативе). В плюсе у человека будет один набор качеств, а в минусе — соответственно противоположный. Ваша реализация в жизни напрямую будет зависеть от того, в каком состоянии Вы находитесь.\n\nУ Вас отлично работает логика, ум и интеллект — действуете исходя из целесообразности. Свобода для Вас дороже денег. У Вас заложена высокая коммуникация, поэтому в сфере торговли и бизнеса Вам нет равных.\n\nВектор сознания направлен на логику: правильно/неправильно, логично/нелогично.\n\nВ связи с тем, что Вы обладаете тонкой аурой, Вас очень легко обидеть. Поэтому Вашей задачей является увеличение любви.`,6:`При описании личности важно понимать, что каждый человек может находиться в двух состояниях: в плюсе (позитиве) или в минусе (негативе). В плюсе у человека будет один набор качеств, а в минусе — соответственно противоположный. Ваша реализация в жизни напрямую будет зависеть от того, в каком состоянии Вы находитесь.\n\nВы — бриллиант общества. Творец наделил Вас энергиями мудрости и сексуальности. Вы легко привлекаете инвестиции и получаете материальные блага.\n\nВектор сознания направлен на свой личный комфорт, любовь и секс. Душа реализуется через творчество.\n\nВ минусе: мстительность, лень, неразборчивость в отношениях.`,7:`При описании личности важно понимать, что каждый человек может находиться в двух состояниях: в плюсе (позитиве) или в минусе (негативе). В плюсе у человека будет один набор качеств, а в минусе — соответственно противоположный. Ваша реализация в жизни напрямую будет зависеть от того, в каком состоянии Вы находитесь.\n\nУ Вас с рождения заложена харизма, 100% интуиция и сексуальная энергия. Вектор сознания направлен на признание Ваших действий. Если работаете над собой и поднимаете энергию в голову — становитесь гениальным человеком.\n\n97% всей Вашей энергии сосредоточено в первой чакре, поэтому если её не поднимать в голову, то будут проявляться такие качества как хаос в голове, рассеянность.\n\nДля успешной реализации в жизни Вам необходимо жить в дисциплине ума!`,8:`При описании личности важно понимать, что каждый человек может находиться в двух состояниях: в плюсе (позитиве) или в минусе (негативе). В плюсе у человека будет один набор качеств, а в минусе — соответственно противоположный. Ваша реализация в жизни напрямую будет зависеть от того, в каком состоянии Вы находитесь.\n\nУ Вас заложены: контроль, скрупулёзность, материализм и реализм. Вектор сознания направлен на контроль за материальным миром. Душа реализуется через труд — чем труднее работа, тем яснее ум.\n\nВ минусе: сомнения, недоверие обществу, тотальный контроль, тунеядство.\n\nДля успешной реализации в жизни Вам необходимо уйти от контроля и прийти к служению людям!`,9:`При описании личности важно понимать, что каждый человек может находиться в двух состояниях: в плюсе (позитиве) или в минусе (негативе). В плюсе у человека будет один набор качеств, а в минусе — соответственно противоположный. Ваша реализация в жизни напрямую будет зависеть от того, в каком состоянии Вы находитесь.\n\nВы человек действия, обладаете сверхэмоциональным, достаточно вспыльчивым характером. Вектор сознания направлен только на победу.\n\nВ плюсе: стремительность, спортивность, динамичность, воинственность. В минусе: ярость, паранойя, наивность.\n\nДля успешной реализации в жизни Вам необходимо уйти от эмоций и действовать исходя из целесообразности!`};

}

async function init(){
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  if(!id){
    document.getElementById('report-content').innerHTML = `<div class="error-box"><div class="error-icon">🔍</div><p style="color:var(--text3);font-size:14px;">Отчёт не найден. Проверьте ссылку.</p></div>`;
    return;
  }
  const { data: report, error } = await sb.from('psycho_reports').select('*').eq('id', id).single();
  if(error || !report){
    document.getElementById('report-content').innerHTML = `<div class="error-box"><div class="error-icon">❌</div><p style="color:var(--text3);font-size:14px;">Отчёт не найден или был удалён.</p></div>`;
    return;
  }
  let master = null;
  if(report.master_id){
    const { data: m } = await sb.from('profiles').select('name,specialization,whatsapp,instagram').eq('id', report.master_id).single();
    master = m;
  }
  renderReport(report, master);
}

init();
</script>
</body>
</html>
