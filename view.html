<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Энерго Компас</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #F6F4EF 0%, #F0EDE6 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 12px;
      padding: 40px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      text-align: center;
    }
    .icon { font-size: 60px; margin-bottom: 20px; }
    h1 { font-size: 24px; color: #1A1814; margin-bottom: 10px; }
    p { font-size: 14px; color: #8A8680; line-height: 1.6; margin-bottom: 10px; }
    .loading { font-size: 48px; animation: spin 1s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .error { color: #7A1E1E; }
    .success { color: #1E5C34; }
  </style>
</head>
<body>

<div class="container" id="container">
  <div class="icon loading">⏳</div>
  <h1>Загружаем...</h1>
  <p>Пожалуйста, подождите</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://gigfvlhcrtuosfnkzqpt.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdpZ2Z2bGhjcnR1b3NmbmtzcXB0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE2OTQ1MjI3MzMsImV4cCI6MTk3NzkyMjczM30.v1E7Y6h8-xH7YTVZzMvAXLXYbKFiGMQvNgPkT_aK7f4';
  
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  async function loadAccess() {
    try {
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');

      console.log('Токен:', token);

      if (!token) {
        showError('❌ Ошибка', 'Ссылка невалидна — отсутствует токен доступа');
        return;
      }

      // Загружаем доступ из БД
      const { data: grant, error: dbError } = await supabaseClient
        .from('access_grants')
        .select('*')
        .eq('access_token', token)
        .single();

      console.log('Grant:', grant);
      console.log('DB Error:', dbError);

      if (dbError || !grant) {
        showError('❌ Ссылка не найдена', 'Эта ссылка больше не активна или неправильно скопирована');
        return;
      }

      // Проверка: исчерпан ли лимит?
      if (grant.opens_count >= grant.max_opens) {
        showError('❌ Лимит исчерпан', `Эта ссылка была открыта ${grant.opens_count} раз. Попросите новую ссылку у мастера.`);
        return;
      }

      // Увеличиваем счётчик
      const { error: updateError } = await supabaseClient
        .from('access_grants')
        .update({
          opens_count: grant.opens_count + 1,
          last_opened_at: new Date().toISOString()
        })
        .eq('id', grant.id);

      if (updateError) {
        console.error('Ошибка обновления:', updateError);
      }

      // Показываем предупреждение об оставшихся открытиях
      const remaining = grant.max_opens - grant.opens_count - 1;
      if (remaining <= 2 && remaining > 0) {
        setTimeout(() => {
          alert(`⚠️ Осталось ${remaining} открытий.\nПосле этого потребуется новая ссылка от мастера.`);
        }, 1000);
      }

      // Перенаправляем на календарь мастера
      const masterId = grant.master_id;
      console.log('Переход на календарь мастера:', masterId);
      
      window.location.href = '/personal-energy-calendar.html?master_id=' + masterId + '&token=' + token;

    } catch (err) {
      console.error('Ошибка:', err);
      showError('❌ Ошибка загрузки', err.message);
    }
  }

  function showError(title, message) {
    const container = document.getElementById('container');
    container.innerHTML = `
      <div class="icon error">❌</div>
      <h1>${title}</h1>
      <p>${message}</p>
      <p style="margin-top: 20px; font-size: 12px; color: #999;">
        Свяжитесь с мастером для получения новой ссылки.
      </p>
    `;
  }

  window.addEventListener('load', loadAccess);
</script>

</body>
</html>
