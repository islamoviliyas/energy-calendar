<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Энерго Компас - Ваша консультация</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
    
    .warning {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #fff3cd;
      border: 1px solid #ffc107;
      color: #856404;
      padding: 15px 20px;
      border-radius: 6px;
      max-width: 400px;
      z-index: 10000;
      font-size: 14px;
      line-height: 1.5;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    
    .error-container {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 20px;
    }
    
    .error-box {
      text-align: center;
      color: white;
      max-width: 500px;
    }
    
    .error-icon {
      font-size: 64px;
      margin-bottom: 20px;
    }
    
    .error-title {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 15px;
      line-height: 1.4;
    }
    
    .error-text {
      color: rgba(255,255,255,0.8);
      font-size: 14px;
    }
    
    .content-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: white;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div id="content"></div>

  <script>
    // Подключаем Supabase
    const SUPABASE_URL = 'https://gigfvlhcrtuosfnkzqpt.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdpZ2Z2bGhjcnR1b3NmbmtzcXB0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE2OTQ1MjI3MzMsImV4cCI6MTk3NzkyMjczM30.v1E7Y6h8-xH7YTVZzMvAXLXYbKFiGMQvNgPkT_aK7f4';
    
    const { createClient } = window.supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadAccessByToken() {
      const token = new URLSearchParams(window.location.search).get('token');
      
      console.log('Token из URL:', token);
      
      if (!token) {
        showError('❌ Ссылка невалидна', 'Отсутствует токен доступа');
        return;
      }

      // Загружаем доступ
      const { data: grant, error } = await supabaseClient
        .from('access_grants')
        .select('*')
        .eq('access_token', token)
        .single();

      console.log('Grant:', grant);
      console.log('Error:', error);

      if (error || !grant) {
        showError(
          '❌ Ссылка не найдена',
          'Эта ссылка больше не активна или неправильно скопирована'
        );
        return;
      }

      // ПРОВЕРКА: Исчерпан ли лимит?
      if (grant.opens_count >= grant.max_opens) {
        showError(
          '❌ Лимит открытий исчерпан',
          `Эта ссылка была открыта ${grant.opens_count} раз.\n\nПопросите новую ссылку у мастера.`
        );
        return;
      }

      // УВЕЛИЧИВАЕМ СЧЁТЧИК
      const { error: updateError } = await supabaseClient
        .from('access_grants')
        .update({
          opens_count: grant.opens_count + 1,
          last_opened_at: new Date().toISOString()
        })
        .eq('id', grant.id);

      if (updateError) {
        console.error('Ошибка обновления счётчика:', updateError);
      }

      // Показываем предупреждение об оставшихся открытиях
      const remaining = grant.max_opens - grant.opens_count - 1;
      
      if (remaining <= 2 && remaining > 0) {
        showWarning(`⚠️ Осталось ${remaining} открытий.\nПосле этого потребуется новая ссылка от мастера.`);
      }

      // ПОКАЗЫВАЕМ КОНТЕНТ
      const permissions = grant.permissions;
      const masterId = grant.master_id;

      console.log('Permissions:', permissions);

      // Очищаем страницу
      const content = document.getElementById('content');
      content.innerHTML = `<div class="content-container"><h1>Загружаем данные...</h1></div>`;

      // Загружаем календарь или психоанализ в зависимости от прав
      if (permissions.calendar || permissions.psycho) {
        // Перенаправляем на личный календарь мастера с токеном
        window.location.href = `/personal-energy-calendar.html?master_id=${masterId}&token=${token}`;
      } else {
        showError('❌ Нет прав доступа', 'У вас нет разрешения на просмотр этого контента');
      }
    }

    function showError(title, message) {
      const content = document.getElementById('content');
      content.innerHTML = `
        <div class="error-container">
          <div class="error-box">
            <div class="error-icon">❌</div>
            <div class="error-title">${title}</div>
            <div class="error-text">${message}</div>
          </div>
        </div>
      `;
    }

    function showWarning(message) {
      const warning = document.createElement('div');
      warning.className = 'warning';
      warning.innerHTML = message;
      document.body.appendChild(warning);

      // Закрывается автоматически через 5 секунд
      setTimeout(() => {
        warning.remove();
      }, 5000);
    }

    // При загрузке страницы
    window.addEventListener('load', loadAccessByToken);
  </script>

  <!-- Подключаем Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/+esm"></script>
</body>
</html>
