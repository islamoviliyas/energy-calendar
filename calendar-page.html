<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Энергетический Календарь</title>
<script>
// Quick auth check before loading heavy content
(function(){
  var stored = localStorage.getItem('sb-gigfvlhcrtuosfnkzqpt-auth-token');
  if(!stored){
    // Try sessionStorage
    var keys = Object.keys(localStorage);
    var found = keys.some(function(k){ return k.indexOf('supabase') !== -1 || k.indexOf('sb-') !== -1; });
    if(!found) window.location.href = 'login.html';
  }
})();
</script>
</head>
<body style="margin:0;padding:0;background:#080706;">
<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:16px;">
  <div style="width:40px;height:40px;border:2px solid #C4922A;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
  <div style="color:#B8B098;font-family:'Outfit',sans-serif;font-size:13px;">Загрузка...</div>
</div>
<style>@keyframes spin{to{transform:rotate(360deg);}}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://gigfvlhcrtuosfnkzqpt.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Hw69inUK0lqA5ECoVeGgRQ_kWEyD4Pt';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function checkAndLoad(){
  const { data: { session } } = await supabaseClient.auth.getSession();
  if(!session){ window.location.href = 'login.html'; return; }
  
  const { data: profile } = await supabaseClient
    .from('profiles')
    .select('is_active, role')
    .eq('id', session.user.id)
    .single();
    
  if(!profile || !profile.is_active){ window.location.href = 'login.html'; return; }
  
  // Load the actual calendar
  window.location.href = 'personal-energy-calendar.html';
}
checkAndLoad();
</script>
</body>
</html>
