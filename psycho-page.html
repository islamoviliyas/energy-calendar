<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Психоанализ личности · Digital Consulting</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--gold:#B8892A;--gold-light:#D4A84B;--gold-pale:#F8F0DC;--radius:14px;--transition:0.3s ease;}
[data-theme="light"]{--bg:#F6F4EF;--bg2:#FFFFFF;--bg3:#F0EDE6;--bg4:#E8E4D8;--text:#1A1814;--text2:#3A3830;--text3:#8A8680;--border:rgba(0,0,0,0.08);--border-gold:rgba(184,137,42,0.3);--shadow:0 2px 20px rgba(0,0,0,0.06);--do-bg:#F0F7F2;--do-border:#B8DEC4;--do-text:#1E5C34;--dont-bg:#FBF0F0;--dont-border:#E8B8B8;--dont-text:#7A1E1E;--plus-bg:#F0F7F2;--plus-border:#B8DEC4;--plus-text:#1E5C34;--minus-bg:#FBF0F0;--minus-border:#E8B8B8;--minus-text:#7A1E1E;--tag-green-bg:#E8F7EE;--tag-green-text:#1E5C34;--tag-red-bg:#FBF0F0;--tag-red-text:#7A1E1E;--tag-blue-bg:#EEF4FB;--tag-blue-text:#1E3C6A;--matrix-empty-bg:#F6F4EF;--matrix-empty-border:rgba(0,0,0,0.1);--matrix-empty-text:#C0BDB0;--matrix-full-bg:#F8F0DC;--matrix-full-border:#B8892A;--matrix-full-text:#1A1814;--line-active-bg:#F8F0DC;--line-active-border:rgba(184,137,42,0.4);--how-bg:#FFFBF0;--how-border:rgba(184,137,42,0.25);--how-title:#8B6010;--energy-present-bg:#F0F7F2;--energy-present-border:#B8DEC4;--energy-present-text:#1E5C34;--energy-absent-bg:#FBF0F0;--energy-absent-border:#E8B8B8;--energy-absent-text:#C06060;}
[data-theme="dark"]{--bg:#0E0D0A;--bg2:#181610;--bg3:#201E16;--bg4:#28261C;--text:#F0EDE4;--text2:#C0BDB0;--text3:#6A6660;--border:rgba(255,255,255,0.07);--border-gold:rgba(184,137,42,0.35);--shadow:0 2px 24px rgba(0,0,0,0.35);--do-bg:#0E1C12;--do-border:#1E4228;--do-text:#6ACC84;--dont-bg:#1C0E0E;--dont-border:#421E1E;--dont-text:#E08080;--plus-bg:#0E1C12;--plus-border:#1E4228;--plus-text:#6ACC84;--minus-bg:#1C0E0E;--minus-border:#421E1E;--minus-text:#E08080;--tag-green-bg:rgba(30,92,52,0.2);--tag-green-text:#6ACC84;--tag-red-bg:rgba(122,30,30,0.2);--tag-red-text:#E08080;--tag-blue-bg:rgba(30,60,106,0.25);--tag-blue-text:#7AAAE0;--matrix-empty-bg:#141208;--matrix-empty-border:rgba(255,255,255,0.08);--matrix-empty-text:#4A4840;--matrix-full-bg:rgba(184,137,42,0.15);--matrix-full-border:#B8892A;--matrix-full-text:#F0EDE4;--line-active-bg:rgba(184,137,42,0.1);--line-active-border:rgba(184,137,42,0.35);--how-bg:rgba(184,137,42,0.06);--how-border:rgba(184,137,42,0.2);--how-title:#D4A84B;--energy-present-bg:rgba(30,92,52,0.15);--energy-present-border:#1E4228;--energy-present-text:#6ACC84;--energy-absent-bg:rgba(122,30,30,0.15);--energy-absent-border:#421E1E;--energy-absent-text:#E08080;}

*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-weight:300;min-height:100vh;transition:background var(--transition),color var(--transition);line-height:1.6;}
.wrap{max-width:880px;margin:0 auto;padding:0 24px 80px;}
header{display:flex;align-items:center;justify-content:space-between;padding:28px 0 22px;border-bottom:1px solid var(--border);margin-bottom:28px;flex-wrap:wrap;gap:12px;}
.logo h1{font-family:'Playfair Display',serif;font-size:20px;font-weight:500;}
.logo h1 span{color:var(--gold);}
.logo p{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--text3);margin-top:4px;}
.header-right{display:flex;align-items:center;gap:10px;}
.back-btn{padding:7px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:40px;color:var(--text2);font-family:'Inter',sans-serif;font-size:12px;cursor:pointer;text-decoration:none;transition:all var(--transition);}
.back-btn:hover{border-color:var(--gold);color:var(--gold);}
.theme-btn{display:flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--border);border-radius:40px;padding:7px 14px;cursor:pointer;font-size:11px;color:var(--text2);font-family:'Inter',sans-serif;transition:all var(--transition);}
.theme-btn:hover{border-color:var(--gold);color:var(--gold);}
.limit-bar{background:var(--bg2);border:1px solid var(--border-gold);border-radius:var(--radius);padding:14px 20px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
.limit-text{font-size:12px;color:var(--text3);}
.limit-track{height:4px;width:180px;background:var(--bg3);border-radius:4px;overflow:hidden;}
.limit-fill{height:100%;background:var(--gold);border-radius:4px;transition:width 0.5s;}
.input-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:32px 36px;box-shadow:var(--shadow);margin-bottom:20px;text-align:center;}
.input-card h2{font-family:'Playfair Display',serif;font-size:20px;font-weight:400;margin-bottom:6px;}
.input-card .sub{font-size:12px;color:var(--text3);margin-bottom:22px;}
.input-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
input[type="text"]{padding:11px 16px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Inter',sans-serif;font-size:14px;outline:none;transition:border-color var(--transition);min-width:180px;}
input[type="text"]:focus{border-color:var(--gold);}
input[type="text"]::placeholder{color:var(--text3);}
input[type="text"].name-input{min-width:160px;}
.btn-main{padding:11px 32px;background:var(--gold);border:none;border-radius:8px;color:#fff;font-family:'Inter',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:opacity 0.2s;}
.btn-main:hover{opacity:0.88;}
.btn-main:disabled{opacity:0.5;cursor:not-allowed;}
.btn-pdf{padding:11px 22px;background:transparent;border:1.5px solid var(--gold);border-radius:8px;color:var(--gold);font-family:'Inter',sans-serif;font-size:12px;font-weight:500;cursor:pointer;transition:all 0.2s;display:none;}
.btn-pdf:hover{background:var(--gold);color:#fff;}
.preview-row{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.preview-badge{flex:1;min-width:120px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:10px;text-align:center;}
.pb-label{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--text3);margin-bottom:5px;}
.pb-val{font-family:'Playfair Display',serif;font-size:30px;color:var(--gold);line-height:1;margin-bottom:2px;}
.section-label{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--text3);margin-bottom:14px;display:flex;align-items:center;gap:10px;}
.section-label::after{content:'';flex:1;height:1px;background:var(--border);}
.divider{border:none;border-top:1px solid var(--border);margin:20px 0;}
.e-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px;overflow:hidden;box-shadow:var(--shadow);}
.e-body{padding:20px 22px;display:flex;flex-direction:column;gap:14px;}
.e-desc{font-size:13px;color:var(--text2);line-height:1.9;}
.e-desc pre{white-space:pre-wrap;font-family:'Inter',sans-serif;font-size:13px;line-height:1.9;}
.pm-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.pm-box{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px 14px;}
.pm-box.plus{background:var(--plus-bg);border-color:var(--plus-border);}
.pm-box.minus{background:var(--minus-bg);border-color:var(--minus-border);}
.pm-title{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);margin-bottom:6px;font-weight:500;}
.pm-box.plus .pm-title{color:var(--plus-text);}
.pm-box.minus .pm-title{color:var(--minus-text);}
.pm-text{font-size:12px;color:var(--text2);line-height:1.65;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.big-nums-row{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
.big-num-card{flex:1;min-width:140px;background:var(--bg2);border:1px solid var(--border-gold);border-radius:var(--radius);padding:18px 14px;text-align:center;box-shadow:var(--shadow);}
.bn-num{font-family:'Playfair Display',serif;font-size:48px;font-weight:400;color:var(--gold);line-height:1;margin-bottom:4px;}
.bn-label{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--text3);}
.name-display{font-family:'Playfair Display',serif;font-size:22px;color:var(--gold);text-align:center;margin-bottom:4px;}
.name-sub{font-size:11px;color:var(--text3);text-align:center;margin-bottom:18px;letter-spacing:1px;}
.tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;margin:2px;}
.tag-green{background:var(--tag-green-bg);color:var(--tag-green-text);}
.tag-red{background:var(--tag-red-bg);color:var(--tag-red-text);}
.tag-blue{background:var(--tag-blue-bg);color:var(--tag-blue-text);}
.matrix-wrap{display:grid;grid-template-columns:repeat(3,60px);gap:7px;}
.matrix-cell{width:60px;height:60px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:20px;border:1.5px solid var(--matrix-empty-border);background:var(--matrix-empty-bg);color:var(--matrix-empty-text);}
.matrix-cell.present{border-color:var(--matrix-full-border);background:var(--matrix-full-bg);color:var(--matrix-full-text);}
.line-item{padding:11px 14px;border-radius:10px;border:1px solid var(--line-active-border);background:var(--line-active-bg);margin-bottom:7px;}
.line-name{font-size:12px;font-weight:500;color:var(--gold);margin-bottom:3px;}
.line-desc{font-size:11.5px;color:var(--text2);line-height:1.55;}
.energy-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px;}
.energy-cell{border-radius:10px;padding:12px 8px;text-align:center;border:1.5px solid var(--border);}
.energy-cell.present{background:var(--energy-present-bg);border-color:var(--energy-present-border);}
.energy-cell.absent{background:var(--energy-absent-bg);border-color:var(--energy-absent-border);}
.ec-num{font-family:'Playfair Display',serif;font-size:26px;line-height:1;margin-bottom:3px;}
.energy-cell.present .ec-num{color:var(--energy-present-text);}
.energy-cell.absent .ec-num{color:var(--energy-absent-text);}
.ec-label{font-size:8px;color:var(--text3);}
.how-card{background:var(--how-bg);border:1px solid var(--how-border);border-radius:10px;padding:14px 16px;margin-bottom:8px;}
.how-title{font-size:10px;font-weight:600;color:var(--how-title);margin-bottom:7px;}
.how-body{font-size:12px;color:var(--text2);line-height:1.75;white-space:pre-line;}
.trigger-list{list-style:none;display:flex;flex-direction:column;gap:5px;}
.trigger-list li{font-size:12px;color:var(--text2);padding:7px 11px;background:var(--bg3);border-radius:6px;border:1px solid var(--border);line-height:1.5;}
.compat-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:7px;}
.compat-label{font-size:10px;color:var(--text3);min-width:90px;}
.compat-item{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500;}
.c-best{background:var(--tag-green-bg);color:var(--tag-green-text);}
.c-good{background:var(--tag-blue-bg);color:var(--tag-blue-text);}
.c-neutral{background:#FDF6E8;color:#7A5010;}
.c-bad{background:var(--tag-red-bg);color:var(--tag-red-text);}
.color-dot{display:inline-block;width:13px;height:13px;border-radius:50%;vertical-align:middle;margin-right:4px;border:2px solid var(--border);}
.gen-rec-list{list-style:none;display:flex;flex-direction:column;gap:7px;}
.gen-rec-list li{font-size:12.5px;color:var(--text2);line-height:1.65;padding:9px 13px;background:var(--bg3);border-radius:8px;border:1px solid var(--border);}
.gen-rec-list li strong{color:var(--gold);}
.prof-card{background:#EEF4FB;border:1px solid #B8CDE8;border-radius:10px;padding:16px 18px;margin-bottom:10px;}
[data-theme="dark"] .prof-card{background:rgba(30,60,106,0.15);border-color:rgba(74,122,200,0.3);}
.prof-card-title{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#1E3C6A;margin-bottom:12px;font-weight:600;}
[data-theme="dark"] .prof-card-title{color:#7AAAE0;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
#psycho-results{animation:fadeUp 0.4s ease both;}
@media(max-width:640px){.pm-grid,.grid-2{grid-template-columns:1fr;}.energy-grid{grid-template-columns:repeat(3,1fr);}.input-card{padding:22px 16px;}}

/* ══════════════════════════════════════
   PDF / PRINT СТИЛИ — плотная верстка
   ══════════════════════════════════════ */
@media print {
  @page {
    size: A4;
    margin: 12mm 14mm 12mm 14mm;
  }

  * {
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }

  /* Скрываем лишнее */
  header, .btn-pdf, .btn-main, .theme-btn, .back-btn,
  .limit-bar, #psycho-preview, .input-card { display: none !important; }

  body {
    background: #F6F4EF !important;
    font-size: 11px !important;
    line-height: 1.4 !important;
  }

  .wrap {
    max-width: 100% !important;
    padding: 0 !important;
  }

  /* Убираем анимации и тени */
  #psycho-results { animation: none !important; }
  .e-card { box-shadow: none !important; }

  /* Компактные отступы */
  .e-card { margin-bottom: 6px !important; }
  .e-body { padding: 10px 12px !important; gap: 8px !important; }
  .divider { margin: 8px 0 !important; }
  .section-label { margin-bottom: 6px !important; font-size: 8px !important; }
  .big-nums-row { margin-bottom: 10px !important; }
  .big-num-card { padding: 10px 8px !important; }
  .bn-num { font-size: 32px !important; }
  .name-display { font-size: 18px !important; margin-bottom: 2px !important; }
  .name-sub { margin-bottom: 10px !important; }

  /* Текст компактнее */
  .e-desc, .e-desc pre { font-size: 11px !important; line-height: 1.5 !important; }
  .pm-text { font-size: 11px !important; line-height: 1.45 !important; }
  .pm-box { padding: 8px 10px !important; }
  .pm-title { font-size: 8px !important; margin-bottom: 3px !important; }

  /* Grid — 2 колонки сохраняем */
  .pm-grid { gap: 6px !important; }
  .grid-2 { gap: 6px !important; }

  /* Матрица компактнее */
  .matrix-wrap { grid-template-columns: repeat(3, 44px) !important; gap: 4px !important; }
  .matrix-cell { width: 44px !important; height: 44px !important; font-size: 16px !important; }

  /* Энергии компактнее */
  .energy-grid { gap: 5px !important; margin-bottom: 6px !important; }
  .energy-cell { padding: 8px 4px !important; }
  .ec-num { font-size: 20px !important; }
  .ec-label { font-size: 7px !important; }

  /* Линии */
  .line-item { padding: 7px 10px !important; margin-bottom: 4px !important; }
  .line-name { font-size: 11px !important; }
  .line-desc { font-size: 10px !important; }

  /* Триггеры */
  .trigger-list li { padding: 5px 9px !important; font-size: 11px !important; }
  .trigger-list { gap: 3px !important; }

  /* Совместимость */
  .compat-row { margin-bottom: 4px !important; }
  .compat-item { font-size: 10px !important; padding: 2px 8px !important; }

  /* Рекомендации */
  .gen-rec-list li { padding: 6px 10px !important; font-size: 11px !important; }
  .gen-rec-list { gap: 4px !important; }

  /* how-card */
  .how-card { padding: 9px 11px !important; margin-bottom: 5px !important; }
  .how-title { font-size: 9px !important; margin-bottom: 4px !important; }
  .how-body { font-size: 10.5px !important; line-height: 1.55 !important; }

  /* prof-card */
  .prof-card { padding: 10px 12px !important; margin-bottom: 6px !important; }

  /* Контроль разрывов страниц */
  .e-card { break-inside: avoid; }
  .pm-box { break-inside: avoid; }
  .how-card { break-inside: avoid; }
  .line-item { break-inside: avoid; }
  .prof-card { break-inside: avoid; }
  .big-num-card { break-inside: avoid; }

  /* Разделы которые лучше не разрывать */
  .big-nums-row { break-inside: avoid; }
  .pm-grid { break-inside: avoid; }
  .matrix-wrap { break-inside: avoid; }
  .energy-grid { break-inside: avoid; }

  /* Цвета для print */
  .pm-box.plus { background: #F0F7F2 !important; border-color: #B8DEC4 !important; }
  .pm-box.minus { background: #FBF0F0 !important; border-color: #E8B8B8 !important; }
  .big-num-card { background: #F8F0DC !important; border-color: #B8892A !important; }
  .bn-num { color: #B8892A !important; }
  .line-item { background: #F8F0DC !important; border-color: rgba(184,137,42,0.4) !important; }
  .prof-card { background: #EEF4FB !important; border-color: #B8CDE8 !important; }
  .energy-cell.present { background: #F0F7F2 !important; border-color: #B8DEC4 !important; }
  .energy-cell.absent { background: #FBF0F0 !important; border-color: #E8B8B8 !important; }
  .tag-green { background: #E8F7EE !important; color: #1E5C34 !important; }
  .tag-red { background: #FBF0F0 !important; color: #7A1E1E !important; }
  .how-card { background: #FFFBF0 !important; border-color: rgba(184,137,42,0.25) !important; }
  .matrix-cell.present { background: #F8F0DC !important; border-color: #B8892A !important; }
  .c-best { background: #E8F7EE !important; color: #1E5C34 !important; }
  .c-good { background: #EEF4FB !important; color: #1E3C6A !important; }
  .c-neutral { background: #FDF6E8 !important; color: #7A5010 !important; }
  .c-bad { background: #FBF0F0 !important; color: #7A1E1E !important; }
  .section-label { color: #8A8680 !important; }
  .name-display { color: #B8892A !important; }
  .gold, .line-name { color: #B8892A !important; }
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="logo">
    <h1>Психоанализ <span>личности</span></h1>
    <p>Digital Consulting</p>
  </div>
  <div class="header-right">
    <a href="cabinet.html" class="back-btn">← Кабинет</a>
    <button class="theme-btn" onclick="toggleTheme()"><span id="theme-icon">🌙</span> <span id="theme-label">Тёмная тема</span></button>
  </div>
</header>

<div class="limit-bar" id="limit-bar" style="display:none;">
  <div class="limit-text" id="limit-text">Использовано 0 из 5 бесплатных анализов</div>
  <div class="limit-track"><div class="limit-fill" id="limit-fill" style="width:0%"></div></div>
</div>

<div class="input-card">
  <h2>Психоанализ личности</h2>
  <p class="sub">Введите имя и дату рождения для персонального анализа</p>
  <div id="psycho-preview" class="preview-row" style="display:none;">
    <div class="preview-badge"><div class="pb-label">Число личности</div><div class="pb-val" id="p-cs-val">—</div></div>
    <div class="preview-badge"><div class="pb-label">Миссия</div><div class="pb-val" id="p-m-val">—</div></div>
  </div>
  <div class="input-row">
    <input type="text" class="name-input" id="psycho-name" placeholder="Имя клиента">
    <input type="text" id="psycho-dob" placeholder="ДД.ММ.ГГГГ" maxlength="10" oninput="psychoInput(this)">
    <button class="btn-main" id="psycho-btn" onclick="calcPsycho()" disabled>Получить анализ</button>
    <button class="btn-pdf" id="pdf-btn" onclick="createLink()">🔗 Создать ссылку</button>
  </div>
</div>

<div id="psycho-results"></div>
</div>

<script>
const PSYCHO_LIMIT = 5;

function initLimitBar(){
  var used = parseInt(localStorage.getItem('psycho_used') || '0');
  var isPaid = localStorage.getItem('psycho_paid') === 'true';
  if(!isPaid){
    document.getElementById('limit-bar').style.display = 'flex';
    document.getElementById('limit-text').textContent = 'Использовано ' + used + ' из ' + PSYCHO_LIMIT + ' бесплатных анализов';
    document.getElementById('limit-fill').style.width = Math.min(100, (used/PSYCHO_LIMIT)*100) + '%';
  }

const PERSONALITY={1:`При описании личности важно понимать, что каждый человек может находиться в двух состояниях: в плюсе (позитиве) или в минусе (негативе). В плюсе у человека будет один набор качеств, а в минусе — соответственно противоположный. Ваша реализация в жизни напрямую будет зависеть от того, в каком состоянии Вы находитесь.\n\nВы — сильная личность. Самостоятельный, независимый и амбициозный человек. Вектор сознания направлен только на себя. Вы не любите, когда Вам указывают, что делать и как. Ваш внутренний девиз: «Я сам(а) всё знаю». Вы — первопроходец, пионер — идёте туда, куда другие боятся идти.\n\nВ плюсе (когда в позитивных эмоциях) в Вас заложены такие качества, как: самостоятельность, смелость, целеустремлённость, уверенность. В минусе (когда в негативных эмоциях) проявляются эгоизм, агрессивность, властность, деспотизм.\n\nДля успешной реализации в жизни Вам необходимо работать над собственным эгоизмом!`,2:`При описании личности важно понимать, что каждый человек может находиться в двух состояниях: в плюсе (позитиве) или в минусе (негативе). В плюсе у человека будет один набор качеств, а в минусе — соответственно противоположный. Ваша реализация в жизни напрямую будет зависеть от того, в каком состоянии Вы находитесь.\n\nВы — тонкий психолог. Умеете чувствовать людей. Вектор сознания направлен на желание понять другого человека. В Вас заложен дар — понимать людей и ситуации лучше, чем другие. Вы можете стать прекрасным дипломатом, психологом, медиатором.\n\nВ плюсе заложены такие качества, как: понимание, дипломатичность, интуиция, мягкость. В минусе проявляется: депрессия, сомнения, двуличность, манипулятивность.\n\nДля успешной реализации в жизни Вам необходимо научиться понимать других людей!`,3:`При описании личности важно понимать, что каждый человек может находиться в двух состояниях: в плюсе (позитиве) или в минусе (негативе). В плюсе у человека будет один набор качеств, а в минусе — соответственно противоположный. Ваша реализация в жизни напрямую будет зависеть от того, в каком состоянии Вы находитесь.\n\nВы — прирождённый наставник и аналитик. Вектор сознания направлен на анализ и управление. Вы очень умный, рассудительный, справедливый человек. Знания и интеллект — Ваши главные активы.\n\nВ плюсе заложены такие качества, как: аналитический склад ума, наставничество, справедливость, мудрость, интеллект. В минусе проявляются: холодность, расчётливость, жёсткость, несправедливость.\n\nДля успешной реализации в жизни Вам необходимо развивать мудрость наставника!`,4:`При описании личности важно понимать, что каждый человек может находиться в двух состояниях: в плюсе (позитиве) или в минусе (негативе). В плюсе у человека будет один набор качеств, а в минусе — соответственно противоположный. Ваша реализация в жизни напрямую будет зависеть от того, в каком состоянии Вы находитесь.\n\nВы человек с креативным мышлением, новатор, трансформатор и борец за справедливость. Вы очень добрый человек. Рождены отдавать и при этом для Вас важно, чтобы всё было по-честному. Вектор сознания направлен на поиск целей.\n\nКомфортнее всего Вы чувствуете себя в состоянии стабильности. В минусе будут проявляться такие качества как: неудовлетворённость, разрушение, отчуждённость, апатия.\n\nДля успешной реализации в жизни Вам необходимо изучать законы позитивного мышления!`,5:`При описании личности важно понимать, что каждый человек может находиться в двух состояниях: в плюсе (позитиве) или в минусе (негативе). В плюсе у человека будет один набор качеств, а в минусе — соответственно противоположный. Ваша реализация в жизни напрямую будет зависеть от того, в каком состоянии Вы находитесь.\n\nУ Вас отлично работает логика, ум и интеллект — действуете исходя из целесообразности, а не эмоционального порыва. Свобода для Вас дороже денег. У Вас заложена высокая коммуникация, поэтому в сфере торговли и бизнеса Вам нет равных.\n\nВектор сознания направлен на логику: правильно/неправильно, логично/нелогично. Как правило, преобладает изысканный вкус и чувство стиля.\n\nВ связи с тем, что Вы обладаете тонкой аурой, Вас очень легко обидеть. Поэтому Вашей задачей является увеличение любви.`,6:`При описании личности важно понимать, что каждый человек может находиться в двух состояниях: в плюсе (позитиве) или в минусе (негативе). В плюсе у человека будет один набор качеств, а в минусе — соответственно противоположный. Ваша реализация в жизни напрямую будет зависеть от того, в каком состоянии Вы находитесь.\n\nВы — бриллиант общества. Творец наделил Вас энергиями мудрости и сексуальности. В сравнении с другими людьми Вы легко привлекаете инвестиции и получаете материальные блага.\n\nВектор сознания направлен на свой личный комфорт, любовь и секс. Душа реализуется через творчество. Вы полны молодости, учтивы, любите роскошь, артистичны.\n\nВ минусе проявляются такие качества как мстительность, неразборчивость в отношениях.`,7:`При описании личности важно понимать, что каждый человек может находиться в двух состояниях: в плюсе (позитиве) или в минусе (негативе). В плюсе у человека будет один набор качеств, а в минусе — соответственно противоположный. Ваша реализация в жизни напрямую будет зависеть от того, в каком состоянии Вы находитесь.\n\nУ Вас с рождения заложена харизма, 100% интуиция и сексуальная энергия. Вектор сознания направлен на признание Ваших действий. Если работаете над собой и поднимаете энергию в голову — становитесь гениальным человеком.\n\n97% всей Вашей энергии сосредоточено в первой чакре, поэтому если её не поднимать в голову, то будут проявляться такие качества как хаос в голове, рассеянность.\n\nДля успешной реализации в жизни Вам необходимо жить в дисциплине ума!`,8:`При описании личности важно понимать, что каждый человек может находиться в двух состояниях: в плюсе (позитиве) или в минусе (негативе). В плюсе у человека будет один набор качеств, а в минусе — соответственно противоположный. Ваша реализация в жизни напрямую будет зависеть от того, в каком состоянии Вы находитесь.\n\nУ Вас заложены такие качества, как: контроль, скрупулёзность, материализм и реализм. Вектор сознания направлен на контроль за материальным миром. Душа реализуется через труд — чем труднее работа, тем яснее ум.\n\nВ минусе заложены сомнения, недоверие обществу, тотальный контроль, тунеядство и отшельничество.\n\nДля успешной реализации в жизни Вам необходимо уйти от контроля и прийти к служению людям!`,9:`При описании личности важно понимать, что каждый человек может находиться в двух состояниях: в плюсе (позитиве) или в минусе (негативе). В плюсе у человека будет один набор качеств, а в минусе — соответственно противоположный. Ваша реализация в жизни напрямую будет зависеть от того, в каком состоянии Вы находитесь.\n\nВы человек действия, обладаете сверхэмоциональным, достаточно вспыльчивым характером. Вектор сознания направлен только на победу.\n\nВ плюсе заложены такие качества, как: стремительность, спортивность, динамичность, воинственность. В минусе проявляются такие качества как ярость, паранойя, наивность.\n\nДля успешной реализации в жизни Вам необходимо уйти от эмоций и действовать исходя из целесообразности!`};

function digitSum(n){let s=n.toString().split('').reduce((a,c)=>a+parseInt(c),0);return s>9?digitSum(s):s;}
function parseDate(str){const p=str.split('.');if(p.length!==3)return null;const d=parseInt(p[0]),m=parseInt(p[1]),y=parseInt(p[2]);if(isNaN(d)||isNaN(m)||isNaN(y))return null;if(d<1||d>31||m<1||m>12||y<1900||y>2030)return null;return{d,m,y};}

function psychoInput(el){
  let v=el.value,clean=v.replace(/\D/g,''),fmt='';
  for(let i=0;i<clean.length&&i<8;i++){if(i===2||i===4)fmt+='.';fmt+=clean[i];}
  if(fmt!==v)el.value=fmt;
  const p=parseDate(el.value);
  const btn=document.getElementById('psycho-btn');
  const prev=document.getElementById('psycho-preview');
  if(p){
    const cs=digitSum(p.d);
    const mission=digitSum((p.d.toString()+p.m.toString()+p.y.toString()).split('').reduce((a,c)=>a+parseInt(c),0));
    prev.style.display='flex';
    document.getElementById('p-cs-val').textContent=cs;
    document.getElementById('p-m-val').textContent=mission;
    btn.disabled=false;
  }else{
    prev.style.display='none';
    btn.disabled=true;
  }
}

// ── Supabase для сохранения отчётов ──
const SUPABASE_URL_R = 'https://gigfvlhcrtuosfnkzqpt.supabase.co';
const SUPABASE_KEY_R = 'sb_publishable_Hw69inUK0lqA5ECoVeGgRQ_kWEyD4Pt';
const sbClient = window.supabase.createClient(SUPABASE_URL_R, SUPABASE_KEY_R);

async function createLink(){
  const btn = document.getElementById('pdf-btn');
  btn.textContent = '⏳ Создаём...';
  btn.disabled = true;

  const name = document.getElementById('psycho-name').value.trim();
  const dob = document.getElementById('psycho-dob').value.trim();
  const p = parseDate(dob);
  if(!p){ btn.textContent = '🔗 Создать ссылку'; btn.disabled = false; return; }

  const cs = digitSum(p.d);
  const mission = digitSum((p.d.toString()+p.m.toString()+p.y.toString()).split('').reduce((a,c)=>a+parseInt(c),0));

  // Получаем master_id из URL или сессии (с таймаутом)
  const urlParams = new URLSearchParams(window.location.search);
  let masterId = urlParams.get("master") || null;
  if(!masterId){
    try {
      const sessionPromise = sbClient.auth.getSession();
      const timeoutPromise = new Promise(r => setTimeout(()=>r({data:{session:null}}), 2000));
      const { data: { session } } = await Promise.race([sessionPromise, timeoutPromise]);
      masterId = session ? session.user.id : null;
    } catch(e){ masterId = null; }
  }

  const { data, error } = await sbClient.from('psycho_reports').insert({
    master_id: masterId,
    client_name: name || 'Клиент',
    dob: dob,
    cs: cs,
    mission: mission
  }).select().single();

  if(error || !data){
    btn.textContent = '🔗 Создать ссылку';
    btn.disabled = false;
    alert('Ошибка при создании ссылки. Попробуйте ещё раз.');
    return;
  }

  const base = window.location.origin + window.location.pathname.replace('psycho-page.html','');
  const link = base + 'report.html?id=' + data.id;

  // Показываем модальное окно со ссылкой
  showLinkModal(link, name);

  btn.textContent = '🔗 Создать ссылку';
  btn.disabled = false;
}

function showLinkModal(link, name){
  // Удаляем старый модал если есть
  const old = document.getElementById('link-modal');
  if(old) old.remove();

  const modal = document.createElement('div');
  modal.id = 'link-modal';
  modal.style.cssText = `position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px);`;
  modal.innerHTML = `
    <div style="background:var(--bg2);border:1px solid var(--border-gold);border-radius:16px;padding:28px;max-width:480px;width:100%;box-shadow:0 8px 40px rgba(0,0,0,0.2);">
      <div style="font-family:'Playfair Display',serif;font-size:20px;color:var(--gold);margin-bottom:6px;">Ссылка готова ✦</div>
      <div style="font-size:12px;color:var(--text3);margin-bottom:18px;">Отправьте эту ссылку ${name ? `клиенту <strong style="color:var(--text)">${name}</strong>` : 'клиенту'}</div>
      <div style="background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:11px 14px;font-size:12px;color:var(--gold);word-break:break-all;margin-bottom:14px;">${link}</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <button onclick="copyReportLink('${link}',this)" style="flex:1;padding:11px;background:var(--gold);border:none;border-radius:8px;color:#fff;font-family:'Inter',sans-serif;font-size:13px;font-weight:500;cursor:pointer;">Скопировать ссылку</button>
        <button onclick="document.getElementById('link-modal').remove()" style="padding:11px 18px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text2);font-family:'Inter',sans-serif;font-size:13px;cursor:pointer;">Закрыть</button>
      </div>
      <div style="margin-top:12px;font-size:11px;color:var(--text3);">Ссылка действует бессрочно и открывается на любом устройстве</div>
    </div>`;
  document.body.appendChild(modal);
  modal.addEventListener('click', e => { if(e.target === modal) modal.remove(); });
}

function copyReportLink(link, btn){
  navigator.clipboard.writeText(link).catch(()=>{
    const el = document.createElement('textarea');
    el.value = link; document.body.appendChild(el); el.select();
    document.execCommand('copy'); document.body.removeChild(el);
  });
  btn.textContent = 'Скопировано ✓';
  btn.style.background = '#4A8A60';
  setTimeout(()=>{ btn.textContent='Скопировать ссылку'; btn.style.background=''; }, 2500);
}

function toggleTheme(){
  const h=document.documentElement;
  const dark=h.getAttribute('data-theme')==='dark';
  h.setAttribute('data-theme',dark?'light':'dark');
  document.getElementById('theme-icon').textContent=dark?'🌙':'☀️';
  document.getElementById('theme-label').textContent=dark?'Тёмная тема':'Светлая тема';
}

initLimitBar();
