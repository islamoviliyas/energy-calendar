<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Психоанализ личности</title>
</head>
<body style="margin:0;padding:0;background:#080706;">
<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:16px;">
  <div style="width:40px;height:40px;border:2px solid #C4922A;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
  <div style="color:#B8B098;font-family:'Outfit',sans-serif;font-size:13px;">Загрузка...</div>
</div>
<style>@keyframes spin{to{transform:rotate(360deg);}}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://gigfvlhcrtuosfnkzqpt.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Hw69inUK0lqA5ECoVeGgRQ_kWEyD4Pt';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const PSYCHO_LIMIT = 3;

async function checkAndLoad(){
  const { data: { session } } = await supabaseClient.auth.getSession();
  if(!session){ window.location.href = 'login.html'; return; }
  
  const { data: profile } = await supabaseClient
    .from('profiles')
    .select('*')
    .eq('id', session.user.id)
    .single();
    
  if(!profile || !profile.is_active){ window.location.href = 'login.html'; return; }
  
  const isFull = profile.plan === 'full' || profile.role === 'admin';
  const used = profile.psycho_count || 0;
  
  if(!isFull && used >= PSYCHO_LIMIT){
    // Show limit exceeded message
    document.body.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;background:#080706;">
        <div style="max-width:400px;text-align:center;font-family:'Outfit',sans-serif;">
          <div style="font-size:48px;margin-bottom:20px;">🔒</div>
          <h2 style="color:#F0EBE0;font-size:22px;margin-bottom:12px;font-weight:400;">Лимит исчерпан</h2>
          <p style="color:#B8B098;font-size:14px;line-height:1.7;margin-bottom:24px;">
            Вы использовали все ${PSYCHO_LIMIT} бесплатных психоанализа.<br>
            Для получения полного доступа свяжитесь с администратором.
          </p>
          <a href="https://wa.me/77001234567?text=Хочу+перейти+на+полный+пакет" 
             style="display:inline-block;padding:13px 32px;background:#C4922A;color:#080706;text-decoration:none;font-weight:600;font-size:14px;margin-bottom:12px;">
            Написать в WhatsApp
          </a>
          <br>
          <a href="cabinet.html" style="color:#6A6450;font-size:13px;text-decoration:none;">← Вернуться в кабинет</a>
        </div>
      </div>`;
    return;
  }
  
  // Increment counter for non-full users
  if(!isFull){
    await supabaseClient
      .from('profiles')
      .update({ psycho_count: used + 1 })
      .eq('id', session.user.id);
  }
  
  // Store user info for psycho page
  sessionStorage.setItem('user_plan', profile.plan);
  sessionStorage.setItem('user_id', session.user.id);
  sessionStorage.setItem('user_name', profile.name || '');
  
  // Redirect to main tool - psycho tab
  window.location.href = 'personal-energy-calendar.html#psycho';
}
checkAndLoad();
</script>
</body>
</html>
